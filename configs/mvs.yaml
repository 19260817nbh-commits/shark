# enemy_color: "red"
enemy_color: "blue"


#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: GPU
min_confidence: 0.8
use_traditional: true

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----USB相机参数-----#####
image_width: 640
image_height: 360
new_image_width: 1280
new_image_height: 720
fov_h: 57.7 #87.7
fov_v: 56.7 
new_fov_h: 37 #67
new_fov_v: 40.9
usb_frame_rate: 60
usb_exposure: 305 #1-80000______250
new_usb_exposure: 320
usb_gamma: 160
usb_gain: 10 #0-96

#####-----工业相机参数-----#####
camera_name: "hikrobot"
exposure_ms: 2
gain: 16
vid_pid: "2bdf:0001"

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree
min_confidence: 0.8

#####-----cboard参数-----#####
quaternion_canid: 0x01
bullet_speed_canid: 0x110
send_canid: 0xff
can_interface: "can0"

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: -2.5 # degree -2.5
pitch_offset: 0  # degree 2
comming_angle: 70 # degree
leaving_angle: 30 # degree
decision_speed: 7 # rad/s
high_speed_delay_time: 0.066 # s
low_speed_delay_time: 0.015 # s

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

#####-----decider参数-----#####
mode: 1

#####-----工业相机标定参数-----#####
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

# 重投影误差: 0.1322px
camera_matrix: [1776.9477196851155, 0, 756.31235265560952, 0, 1776.0591253569607, 566.16539069551641, 0, 0, 1]
distort_coeffs: [-0.08382326954462313, 0.097449270330296239, -0.0012558283068959985, 0.0037372210254148081, 0]

R_camera2gimbal: [0, 0, 1, -1, 0, 0, 0, -1, 0]
t_camera2gimbal: [0.1, 0, 0.05]


#####-----buff_detector参数-----#####
model: "assets/buff_climber_9pt.onnx"
ConfidenceThreshold: 0.5
IouThreshold: 0.2
binary_threshold: 120          # 二值化阈值 (0-255)
dilate_kernel_size: 5          # 膨胀核大小 px
dilate_iterations: 1           # 膨胀迭代次数
r_center_extrapolate: 1.4      # R标中心外推因子
r_center_mask_ratio: 0.8       # mask半径 = 扇叶到中心距离 * 此比例
r_center_contour_div: 3.0      # 轮廓距离加权除数 (越大距离权重越小)
r_center_refine_max_shift: 5.0 # 传统R相对模型R的最大修正量 px
dedup_distance: 18.0           # 候选框去重中心距离 px
lose_max: 20                   # 连续无检测帧数上限
small_assoc_max_jump_px: 140.0 # 小符目标中心跨帧最大跳变 px

#####-----buff_pnp参数-----#####
pnp_mode: "4i"                 # 4=仅IPPE, 4i=IPPE+4点精化, 5=额外加入R中心精化
reprojection_error_threshold_px: 30.0
buff_r_to_target: 0.700        # R中心到靶心距离 m
buff_target_top: 0.115         # 靶面上边中点相对靶心的径向距离 m
buff_target_bottom: 0.115
buff_target_left: 0.115
buff_target_right: 0.115
buff_r_center_z: 0.0           # 模型R中心在buff系z坐标

detect:
  contrast: 1
  brightness: 
    blue: -120
    red: -100
  brightness_threshold:
    blue: 120
    red: 80
  morphology_size:
    blue: 3
    red: 2
  dilate_size: 1
  # canny_low_threshold: 100
  # canny_high_threshold: 180
  # approx_epsilon: 1.0
  R_contours_min_area: 1
  R_contours_max_area: 600
  fanblades_head_contours_min_area: 300
  fanblades_head_contours_max_area: 8000
  fanblades_body_contours_min_area: 1000
  fanblades_body_contours_max_area: 4000
  standard_fanblade_path: ./assets/standard_fanblade.jpg

#####-----buff_aimer参数-----#####
aim_time: 0.200 # s
wait_time: 0.050 # s
fire_gap_time: 0.700 # s
predict_time: 0.300 # s
