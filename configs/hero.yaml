# enemy_color: "red"
enemy_color: "blue"

#####-----神经网络参数-----#####
yolo_name: yolov5_trt
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/0526.engine
device: GPU
min_confidence: 0.8
use_traditional: true

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false


#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree
min_confidence: 0.8


#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: 0 # degree -2.5
pitch_offset: 0 # degree 2
comming_angle: 80 # degree
leaving_angle: 10 # degree
decision_speed: 8 # rad/s
high_speed_delay_time: 0.015 # s
low_speed_delay_time: 0.015 # s


#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

#####-----工业相机参数-----#####
camera_name: "hikrobot"
exposure_ms: 1
gain: 16.9
vid_pid: "2bdf:0001"


R_gimbal2imubody: [0, -1, 0, 1, 0, 0, 0, 0, 1]

# 重投影误差: 0.2120px
camera_matrix: [1782.3574548607339, 0, 726.21933418021774, 0, 1782.0059814404451, 572.59230590502102, 0, 0, 1]
distort_coeffs: [-0.054277654553774583, 0.085424413733177496, 0.0010950163029845171, 0.0033328356447302836, 0]
# 相机同理想情况的偏角: yaw-1.65 pitch-0.46 roll-4.75 degree
# 标定板到世界坐标系原点的水平距离: 1.96 m
# 标定板同竖直摆放时的偏角: yaw1.50 pitch4.39 roll-5.12 degree
R_camera2gimbal: [0.029407046868529026, -0.0055379872571233672, 0.99955217787347728, -0.99612834094625824, -0.083043507478737205, 0.028846216897265638, 0.082846568777030963, -0.99653053468660391, -0.0079586103751740564]
t_camera2gimbal: [0.038761438666805891, 0.10137032654760136, 0.086348276489071757]




#####-----cboard参数-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

#####-----gimbal参数-----#####
com_port: "/dev/ttyACM0"
yaw_kp: 0
yaw_kd: 0
pitch_kp: 0
pitch_kd: 0

#####-----planner-----#####
fire_thresh: 0.0035

max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]

#####-----buff_detector参数-----#####
model: "assets/buff_climber_9pt.onnx"
ConfidenceThreshold: 0.5
IouThreshold: 0.2
binary_threshold: 120          # 二值化阈值 (0-255)
dilate_kernel_size: 5          # 膨胀核大小 px
dilate_iterations: 1           # 膨胀迭代次数
r_center_extrapolate: 1.4      # R标中心外推因子
r_center_mask_ratio: 0.8       # mask半径 = 扇叶到中心距离 * 此比例
r_center_contour_div: 3.0      # 轮廓距离加权除数 (越大距离权重越小)
r_center_refine_max_shift: 5.0 # 传统R相对模型R的最大修正量 px
dedup_distance: 18.0           # 候选框去重中心距离 px
lose_max: 20                   # 连续无检测帧数上限
small_assoc_max_jump_px: 140.0 # 小符目标中心跨帧最大跳变 px

#####-----buff_pnp参数-----#####
pnp_mode: "4i"                 # 4=仅IPPE, 4i=IPPE+4点精化, 5=额外加入R中心精化
reprojection_error_threshold_px: 30.0
buff_r_to_target: 0.700        # R中心到靶心距离 m
buff_target_top: 0.115         # 靶面上边中点相对靶心的径向距离 m
buff_target_bottom: 0.115
buff_target_left: 0.115
buff_target_right: 0.115
buff_r_center_z: 0.0           # 模型R中心在buff系z坐标

#####-----buff_aimer参数-----#####
fire_gap_time: 0.700   # s
predict_time: 0.120     # s