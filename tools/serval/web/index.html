<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serval Scope · 串口波形比对</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
<script src="/native.js" defer></script>
</head><body>
<header>
  <div class="brand"><span class="logo">S</span><div><h1>SERVAL <span>SCOPE</span></h1><span class="subtitle">下发 vs 云台回传</span><span id="desktop-badge" class="desktop-badge" hidden>桌面 GUI</span></div></div>
  <div class="conn"><i id="status-dot"></i><span id="status">正在连接</span><span id="source" class="source"></span></div>
  <div class="rates">
    <span>TX <b id="tx-rate">0</b> Hz</span>
    <span>RX <b id="rx-rate">0</b> Hz</span>
    <span>绘制 <b id="draw-fps">0</b> FPS</span>
  </div>
  <div id="native-tools" class="native-tools" hidden aria-label="本地工具">
    <button id="native-save" type="button" title="把当前缓存的原始数据包逐字节保存为 .bin">保存 .bin</button>
    <button id="native-record" type="button" title="开始/停止把原始字节录制到 records/serial/*.bin">开始录制</button>
    <button id="native-decode" type="button" title="选择 .bin 并离线解算为 tx.csv / rx.csv">离线解码</button>
    <button id="native-open" type="button" disabled title="打开最近一次离线解码的输出目录">打开输出目录</button>
    <span id="native-status" role="status" aria-live="polite"></span>
  </div>
</header>

<main>
  <section class="panel">
    <div class="panel-head">
      <div><h2>位置比对波形</h2><p class="hint">蓝色：实际下发（TX · 阶梯）　绿色：云台实际回传（RX）　原始样本，不做平滑/插值</p></div>
      <div class="controls">
        <label>窗口
          <select id="window">
            <option value="2">2 秒</option>
            <option value="5">5 秒</option>
            <option value="10" selected>10 秒</option>
            <option value="20">20 秒</option>
            <option value="60">60 秒</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="detail-mode"> 逐点</label>
        <button id="pause" type="button">暂停</button>
        <button id="clear" type="button">清空</button>
      </div>
    </div>

    <div class="readouts">
      <div class="readout"><label>YAW 目标</label><strong id="tx-yaw">—</strong><span>反馈 <b id="rx-yaw">—</b> · 误差 <b id="err-yaw">—</b></span></div>
      <div class="readout"><label>PITCH 目标</label><strong id="tx-pitch">—</strong><span>反馈 <b id="rx-pitch">—</b> · 误差 <b id="err-pitch">—</b></span></div>
      <div class="readout small"><label>姿态读数</label><strong id="yaw-value">—</strong><span id="pitch-value">—</span></div>
    </div>

    <div id="charts" class="charts"></div>

    <p class="note" id="note">时间轴来自发送端记录时间（帧级 t_ns）· 丢包/超时/角度跨 ±π 处断线 · 暂停只冻结显示</p>
    <div class="statusline">
      <span>缓存 <b id="retained">0</b> 帧</span>
      <span>缺序号 <b id="udp-missing">0</b></span>
      <span>迟到/重复 <b id="udp-late">0</b></span>
      <span>非法包 <b id="udp-invalid">0</b></span>
      <span>数据源 <b id="source-mode">—</b></span>
      <span id="transport">连接中</span>
    </div>
    <p id="error" class="error" hidden></p>
  </section>
</main>
</body></html>
